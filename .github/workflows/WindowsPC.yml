name: Cloud PC Windows (RustDesk)

on:
  workflow_dispatch:
    inputs:
      rclone_config:
        description: 'Código Base64 do rclone.conf (opcional se configurado nas Secrets)'
        required: false
        default: ''

jobs:
  cloud-pc:
    runs-on: windows-latest

    steps:
      - name: 🚀 Otimização Extrema e Limpeza do Windows
        shell: powershell
        run: |
          Write-Host "[1/5] A aplicar otimizações de alto desempenho..."
          
          # 1. Ativar desempenho máximo de energia
          try {
              $scheme = powercfg -l | Select-String "Ultimate Performance"
              if ($scheme) {
                  powercfg /s e9a42b02-d5df-448d-aa00-03f14749eb61
              } else {
                  powercfg /s SCHEME_MIN
              }
          } catch {}

          # 2. Desativar efeitos visuais e transparências
          try {
              Set-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects" -Name "VisualFXSetting" -Value 2 -ErrorAction SilentlyContinue
              Set-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\DWM" -Name "EnableAeroPeek" -Value 0 -ErrorAction SilentlyContinue
          } catch {}

          # 3. Desativar o Windows Defender (Proteção em Tempo Real) para poupar CPU
          try {
              Set-MpPreference -DisableRealtimeMonitoring $true -DisableIOAVProtection $true -DisableBehaviorMonitoring $true -ErrorAction SilentlyContinue
          } catch {}

          # 4. Parar e desativar serviços pesados desnecessários (SysMain e Windows Update)
          $servicesToDisable = @("SysMain", "wuauserv")
          foreach ($svc in $servicesToDisable) {
              try {
                  Stop-Service -Name $svc -Force -ErrorAction SilentlyContinue
                  Set-Service -Name $svc -StartupType Disabled -ErrorAction SilentlyContinue
              } catch {}
          }

          # 5. Limpeza rápida de temporários para ganhar espaço
          try {
              Remove-Item -Path "C:\Windows\Temp\*" -Recurse -Force -ErrorAction SilentlyContinue
              Remove-Item -Path "$env:TEMP\*" -Recurse -Force -ErrorAction SilentlyContinue
          } catch {}

          Write-Host "✅ Sistema otimizado com sucesso!"

      - name: 🛠️ Configurar Rclone
        shell: powershell
        run: |
          Write-Host "[2/5] Verificando Rclone..."
          $rawBase64 = "${{ github.event.inputs.rclone_config }}"
          if ([string]::IsNullOrWhiteSpace($rawBase64)) {
              $rawBase64 = "${{ secrets.RCLONE_CONFIG_BASE64 }}"
          }

          if (-not [string]::IsNullOrWhiteSpace($rawBase64)) {
              choco install rclone -y --no-progress
              $cleanBase64 = $rawBase64 -replace '\s',''
              $rclonePath = "$env:APPDATA\rclone"
              New-Item -ItemType Directory -Force -Path $rclonePath | Out-Null
              
              try {
                  $bytes = [System.Convert]::FromBase64String($cleanBase64)
                  $decodedConfig = [System.Text.Encoding]::UTF8.GetString($bytes)
                  [System.IO.File]::WriteAllText("$rclonePath\rclone.conf", $decodedConfig)
                  Write-Host "Rclone configurado com sucesso!"
              } catch {
                  Write-Host "Codigo Base64 invalido. O backup sera desativado nesta sessao."
                  Remove-Item -Path "$rclonePath\rclone.conf" -ErrorAction SilentlyContinue
              }
          } else {
              Write-Host "Nenhum Base64 fornecido. A sessao iniciara sem backup da nuvem."
          }

      - name: 📥 Restaurar Backup (Nuvem -> PC)
        continue-on-error: true
        shell: powershell
        run: |
          if (Test-Path "$env:APPDATA\rclone\rclone.conf") {
              Write-Host "[3/5] Restaurando dados da nuvem..."
              rclone copy "gdrive:Backup_PC/Desktop" "$env:USERPROFILE\Desktop" --ignore-existing
              rclone copy "gdrive:Backup_PC/Firefox_AppData" "$env:APPDATA\Mozilla\Firefox" --ignore-existing
              rclone copy "gdrive:Backup_PC/RustDesk_AppData" "$env:APPDATA\rustdesk" --ignore-existing
          } else {
              Write-Host "[3/5] Nenhuma configuração de nuvem ativa. Pulando restauração."
          }

      - name: 🌐 Instalar Firefox
        shell: powershell
        run: |
          Write-Host "[4/5] Instalando Firefox..."
          if (-not (Test-Path "C:\Program Files\Mozilla Firefox\firefox.exe")) {
              choco install firefox -y --no-progress
          }
          $userDesktop = [Environment]::GetFolderPath('Desktop')
          if (-not (Test-Path "$userDesktop\Firefox.lnk")) {
              $WshShell = New-Object -ComObject WScript.Shell
              $Shortcut = $WshShell.CreateShortcut("$userDesktop\Firefox.lnk")
              $Shortcut.TargetPath = "C:\Program Files\Mozilla Firefox\firefox.exe"
              $Shortcut.Save()
          }

            - name: 📱 Instalar e Configurar RustDesk
        shell: powershell
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8

          Write-Host "[5/5] Instalando o RustDesk..."
          choco install rustdesk -y --no-progress
          Start-Sleep -Seconds 5

          $rustdeskPath = "C:\Program Files\RustDesk\rustdesk.exe"
          if (-not (Test-Path $rustdeskPath)) {
              $rustdeskPath = "$env:ProgramFiles\RustDesk\rustdesk.exe"
          }

          # Cria a pasta de configuração e força um ID padrão caso o executável demore a gerar
          $configDir = "$env:APPDATA\rustdesk\config"
          New-Item -ItemType Directory -Force -Path $configDir | Out-Null

          # Inicia o serviço do RustDesk
          Start-Process -FilePath $rustdeskPath -WindowStyle Hidden
          Start-Sleep -Seconds 10

          # Debug: Lista todos os ficheiros criados na pasta AppData para sabermos exatamente onde está o ID
          Write-Host "--- A listar ficheiros na pasta do RustDesk ---"
          Get-ChildItem -Path "$env:APPDATA\rustdesk" -Recurse -ErrorAction SilentlyContinue | Select-Object FullName

          $rustdeskId = "Não encontrado"
          
          # Tenta encontrar o ID nos ficheiros de configuração gerados
          $allFiles = Get-ChildItem -Path "$env:APPDATA\rustdesk" -Recurse -Include *.toml, *.ini, *.txt, *.json -ErrorAction SilentlyContinue
          foreach ($file in $allFiles) {
              $content = Get-Content $file.FullName -Raw -ErrorAction SilentlyContinue
              if ($content -match 'id\s*=\s*"([0-9]{9,10})"') {
                  $rustdeskId = $Matches[1]
                  break
              }
          }

          # Se ainda estiver vazio, força a execução do comando com diretório de trabalho
          if ($rustdeskId -eq "Não encontrado") {
              try {
                  $output = & $rustdeskPath --get-id 2>&1
                  if ($output -match '[0-9]{9,10}') {
                      $rustdeskId = $Matches[0]
                  } else {
                      $rustdeskId = $output
                  }
              } catch {
                  $rustdeskId = "Indisponível (Verifique os logs acima)"
              }
          }

          $senha = "CloudGaming2026#"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "  WINDOWS CLOUD COM RUSTDESK PRONTO!"
          Write-Host "=============================================="
          Write-Host "  RUSTDESK ID : $rustdeskId"
          Write-Host "  SENHA       : $senha"
          Write-Host "=============================================="
          Write-Host ""

      - name: 🔄 Continuous Backup & Keep-Alive Loop
        shell: powershell
        run: |
          Write-Host "Servidor online. Rodando loop de permanência e backup..."
          $totalMinutes = 350
          $backupInterval = 10

          for ($i = 0; $i -lt $totalMinutes; $i++) {
              if (($i % $backupInterval -eq 0) -and (Test-Path "$env:APPDATA\rclone\rclone.conf")) {
                  Write-Host "[$i min] ☁️ Sincronizando arquivos com o Google Drive..."
                  rclone sync "$env:USERPROFILE\Desktop" "gdrive:Backup_PC/Desktop" --quiet
                  
                  if (Test-Path "$env:APPDATA\Mozilla\Firefox") {
                      rclone sync "$env:APPDATA\Mozilla\Firefox" "gdrive:Backup_PC/Firefox_AppData" --quiet
                  }
                  if (Test-Path "$env:APPDATA\rustdesk") {
                      rclone sync "$env:APPDATA\rustdesk" "gdrive:Backup_PC/RustDesk_AppData" --quiet
                  }
              }

              Start-Sleep -Seconds 60
          }

      - name: 💾 Backup Final de Emergência
        if: always()
        shell: powershell
        run: |
          if (Test-Path "$env:APPDATA\rclone\rclone.conf") {
              Write-Host "⚠️ Executando backup final antes do encerramento..."
              rclone sync "$env:USERPROFILE\Desktop" "gdrive:Backup_PC/Desktop" --quiet
              
              if (Test-Path "$env:APPDATA\Mozilla\Firefox") {
                  rclone sync "$env:APPDATA\Mozilla\Firefox" "gdrive:Backup_PC/Firefox_AppData" --quiet
              }
              if (Test-Path "$env:APPDATA\rustdesk") {
                  rclone sync "$env:APPDATA\rustdesk" "gdrive:Backup_PC/RustDesk_AppData" --quiet
              }
              Write-Host "✅ Backup final concluído com sucesso!"
          }
