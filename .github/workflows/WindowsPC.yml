name: Cloud PC Windows Otimizado

on:
  workflow_dispatch:
    inputs:
      rclone_config:
        description: 'Codigo Base64 do rclone.conf (opcional se configurado nas Secrets)'
        required: false
        default: ''

jobs:
  cloud-pc:
    runs-on: windows-latest

    steps:
      - name: Otimizacao Extrema e Limpeza do Windows
        shell: powershell
        run: |
          Write-Host "[1/7] Aplicando otimizacoes avancadas de desempenho..."
          
          # 1. Ativar desempenho máximo de energia
          try {
              $scheme = powercfg -l | Select-String "Ultimate Performance"
              if ($scheme) {
                  powercfg /s e9a42b02-d5df-448d-aa00-03f14749eb61
              } else {
                  powercfg /s SCHEME_MIN
              }
          } catch {}

          # 2. Desativar efeitos visuais, animacoes e transparencias
          try {
              Set-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects" -Name "VisualFXSetting" -Value 2 -ErrorAction SilentlyContinue
              Set-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\DWM" -Name "EnableAeroPeek" -Value 0 -ErrorAction SilentlyContinue
          } catch {}

          # 3. Desativar o Windows Defender (Protecao em Tempo Real) para poupar CPU
          try {
              Set-MpPreference -DisableRealtimeMonitoring $true -DisableIOAVProtection $true -DisableBehaviorMonitoring $true -ErrorAction SilentlyContinue
          } catch {}

          # 4. Parar e desativar servicos pesados desnecessários (SysMain e Windows Update)
          $servicesToDisable = @("SysMain", "wuauserv")
          foreach ($svc in $servicesToDisable) {
              try {
                  Stop-Service -Name $svc -Force -ErrorAction SilentlyContinue
                  Set-Service -Name $svc -StartupType Disabled -ErrorAction SilentlyContinue
              } catch {}
          }

          # 5. Limpeza de ficheiros temporários do sistema
          try {
              Remove-Item -Path "C:\Windows\Temp\*" -Recurse -Force -ErrorAction SilentlyContinue
              Remove-Item -Path "$env:TEMP\*" -Recurse -Force -ErrorAction SilentlyContinue
          } catch {}

          Write-Host "Sistema otimizado com sucesso!"


      - name: Configurar Rclone
        shell: powershell
        run: |
          Write-Host "[2/7] Verificando Rclone..."
          $rawBase64 = "${{ github.event.inputs.rclone_config }}"
          if ([string]::IsNullOrWhiteSpace($rawBase64)) {
              $rawBase64 = "${{ secrets.RCLONE_CONFIG_BASE64 }}"
          }

          if (-not [string]::IsNullOrWhiteSpace($rawBase64)) {
              choco install rclone -y --no-progress
              $cleanBase64 =$rawBase64 -replace '\s',''
              $rclonePath = "$env:APPDATA\rclone"
              New-Item -ItemType Directory -Force -Path $rclonePath | Out-Null
              
              try {
                  $bytes = [System.Convert]::FromBase64String($cleanBase64)
                  $decodedConfig = [System.Text.Encoding]::UTF8.GetString($bytes)
                  [System.IO.File]::WriteAllText("$rclonePath\rclone.conf", $decodedConfig)
                  Write-Host "Rclone configurado com sucesso!"
              } catch {
                  Write-Host "Codigo Base64 invalido. O backup sera desativado nesta sessao."
                  Remove-Item -Path "$rclonePath\rclone.conf" -ErrorAction SilentlyContinue
              }
          } else {
              Write-Host "Nenhum Base64 fornecido. A sessao iniciara sem backup da nuvem."
          }

      - name: Restaurar Backup (Nuvem -> PC)
        continue-on-error: true
        shell: powershell
        run: |
          if (Test-Path "$env:APPDATA\rclone\rclone.conf") {
              Write-Host "[3/7] Restaurando dados da nuvem..."
              rclone copy "gdrive:Backup_PC/Desktop" "$env:USERPROFILE\Desktop" --ignore-existing
              rclone copy "gdrive:Backup_PC/Firefox_AppData" "$env:APPDATA\Mozilla\Firefox" --ignore-existing
              rclone copy "gdrive:Backup_PC/AnyDesk_AppData" "$env:APPDATA\AnyDesk" --ignore-existing
              rclone copy "gdrive:Backup_PC/AnyDesk_ProgramData" "C:\ProgramData\AnyDesk" --ignore-existing
          } else {
              Write-Host "[3/7] Nenhuma configuracao de nuvem ativa. Pulando restauracao."
          }

      - name: Instalar Firefox
        shell: powershell
        run: |
          Write-Host "[4/7] Instalando Firefox..."
          if (-not (Test-Path "C:\Program Files\Mozilla Firefox\firefox.exe")) {
              choco install firefox -y --no-progress
          }

      - name: Limpar Área de Trabalho (Deixar apenas o Firefox)
        shell: powershell
        run: |
          Write-Host "[5/7] Limpando o Desktop..."
          $desktopPath = [Environment]::GetFolderPath('Desktop')
          $publicDesktop = [Environment]::GetFolderPath('CommonDesktopDirectory')
          
          $targetPath = "C:\Program Files\Mozilla Firefox\firefox.exe"
          $shortcutPath = "$desktopPath\Firefox.lnk"
          
          $WshShell = New-Object -ComObject WScript.Shell
          $Shortcut = $WshShell.CreateShortcut($shortcutPath)
          $Shortcut.TargetPath = $targetPath
          $Shortcut.Save()

          Get-ChildItem -Path $desktopPath -Recurse | Where-Object { $_.Name -ne 'Firefox.lnk' } | Remove-Item -Force -Recurse -ErrorAction SilentlyContinue
          Get-ChildItem -Path $publicDesktop -Recurse | Remove-Item -Force -Recurse -ErrorAction SilentlyContinue
          
          Write-Host "Área de trabalho limpa com sucesso! Apenas o Firefox esta presente."


      - name: Instalar e Configurar AnyDesk
        shell: powershell
        run: |
          Write-Host "[6/7] Instalando e configurando AnyDesk..."
          $anydeskPath = "C:\Program Files (x86)\AnyDesk\AnyDesk.exe"
          
          if (-not (Test-Path $anydeskPath)) {$url = "https://download.anydesk.com/AnyDesk.exe"
              Invoke-WebRequest -Uri $url -OutFile "AnyDesk.exe"
              Start-Process -FilePath "AnyDesk.exe" -ArgumentList '--install "C:\Program Files (x86)\AnyDesk" --start-with-win --create-shortcuts --create-desktop-icon --silent' -Wait
              Start-Sleep -Seconds 3
          }

          if (Test-Path $anydeskPath) {$senha = "CloudGaming2026#"
              cmd /c "echo $senha | `"$anydeskPath`" --set-password"
              Start-Sleep -Seconds 2

              $id = cmd /c "`"$anydeskPath`" --get-id"

              Write-Host ""
              Write-Host "=============================================="
              Write-Host "  WINDOWS CLOUD READY!"
              Write-Host "=============================================="
              Write-Host "  ANYDESK ID : $id"
              Write-Host "  SENHA      : $senha"
              Write-Host "=============================================="
              Write-Host ""
          }

      - name: Continuous Backup and Keep-Alive Loop
        shell: powershell
        run: |
          Write-Host "[7/7] Servidor online. Rodando loop de permanencia e backup..."
          $totalMinutes = 350$backupInterval = 10

          for ($i = 0; $i -lt $totalMinutes; $i++) {
              if (($i % $backupInterval -eq 0) -and (Test-Path "$env:APPDATA\rclone\rclone.conf")) {
                  Write-Host "[$i min] Sincronizando arquivos com o Google Drive..."
                  rclone sync "$env:USERPROFILE\Desktop" "gdrive:Backup_PC/Desktop" --quiet
                  
                  if (Test-Path "$env:APPDATA\Mozilla\Firefox") {
                      rclone sync "$env:APPDATA\Mozilla\Firefox" "gdrive:Backup_PC/Firefox_AppData" --quiet
                  }
                  if (Test-Path "C:\ProgramData\AnyDesk") {
                      rclone sync "C:\ProgramData\AnyDesk" "gdrive:Backup_PC/AnyDesk_ProgramData" --quiet
                  }
                  if (Test-Path "$env:APPDATA\AnyDesk") {
                      rclone sync "$env:APPDATA\AnyDesk" "gdrive:Backup_PC/AnyDesk_AppData" --quiet
                  }
              }

              Start-Sleep -Seconds 60
          }

      - name: Backup Final de Emergência
        if: always()
        shell: powershell
        run: |
          if (Test-Path "$env:APPDATA\rclone\rclone.conf") {
              Write-Host "Executando backup final antes do encerramento..."
              rclone sync "$env:USERPROFILE\Desktop" "gdrive:Backup_PC/Desktop" --quiet
              
              if (Test-Path "$env:APPDATA\Mozilla\Firefox") {
                  rclone sync "$env:APPDATA\Mozilla\Firefox" "gdrive:Backup_PC/Firefox_AppData" --quiet
              }
              if (Test-Path "C:\ProgramData\AnyDesk") {
                  rclone sync "C:\ProgramData\AnyDesk" "gdrive:Backup_PC/AnyDesk_ProgramData" --quiet
              }
              if (Test-Path "$env:APPDATA\AnyDesk") {
                  rclone sync "$env:APPDATA\AnyDesk" "gdrive:Backup_PC/AnyDesk_AppData" --quiet
              }
              Write-Host "Backup final concluido com sucesso!"
          }
